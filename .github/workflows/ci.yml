name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  windows-exe:
    name: Cross-compile the Windows exe
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          if [ ! -f src/main.ts ]; then
            echo "src/main.ts is added by the CLI PR; nothing to compile yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p dist
          bun build --compile --target=bun-windows-x64 --windows-hide-console --outfile=dist/github-events-mcp.exe src/main.ts
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: github-events-mcp-windows-x64
          path: dist/github-events-mcp.exe
          if-no-files-found: ignore
