name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  windows-test:
    name: Test and typecheck on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  windows-exe:
    name: Cross-compile the Windows exe
    runs-on: ubuntu-latest
    needs: [test, windows-test]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          mkdir -p dist
          bun build --compile --target=bun-windows-x64 --windows-hide-console --outfile=dist/github-events-mcp.exe src/main.ts
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: github-events-mcp-windows-x64
          path: dist/github-events-mcp.exe
          if-no-files-found: error
