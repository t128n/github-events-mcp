name: Release

# Only a human pushing a version tag starts this. There is no push-to-main trigger and no schedule.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Windows exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - name: Build
        run: |
          mkdir -p dist
          bun build --compile --target=bun-windows-x64 --windows-hide-console --outfile=dist/github-events-mcp.exe src/main.ts
      - name: Checksums
        run: |
          cd dist
          sha256sum github-events-mcp.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/github-events-mcp.exe \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
