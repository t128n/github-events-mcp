name: Release

# Only a human pushing a version tag starts this. There is no push-to-main trigger and no schedule.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Windows exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the source version
        run: |
          version=$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/version.ts)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag version=$version"
          test -n "$version"
          test "$tag" = "$version"
      - run: bun test
      - run: bunx tsc --noEmit
      - name: Build
        run: |
          mkdir -p dist
          # The OS and architecture suffix is what mise uses to pick the asset.
          # mise strips it for single-binary downloads, so the command becomes github-events-mcp.exe.
          bun build --compile --target=bun-windows-x64 \
            --outfile=dist/github-events-mcp-windows-x64.exe src/main.ts
      - name: Checksums
        run: |
          cd dist
          sha256sum github-events-mcp-windows-x64.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/github-events-mcp-windows-x64.exe \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
